trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Instalar Node (Corrigiendo la advertencia naranja de la versión antigua)
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

# 2. Instalar dependencias y compilar el proyecto
- script: |
    npm install
    npm run build
  displayName: 'npm install and build'

# 3. Comprimir la carpeta compilada para enviarla más rápido
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist' 
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true
  displayName: 'Archive build files'

# 4. Desplegar al App Service usando tu llave secreta
- task: AzureWebApp@1
  inputs:
    appType: 'webAppLinux'
    publishProfile: $(publishProfile)
    package: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    startUpCommand: 'pm2 serve /home/site/wwwroot --no-daemon --spa'
  displayName: 'Deploy to Azure App Service'